<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ConverseKit Admin</title>

    <!-- Assets live at the Pages root; the dashboard is served from
         /admin/, so these must be absolute. Generated by
         scripts/gen-brand-assets.mjs. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />

    <!-- Painted before the app boots, so the browser chrome and the
         first frame do not flash white on a dark ground. -->
    <meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta name="description" content="ConverseKit admin — configure bots, knowledge sources, AI providers and retrieval." />
    <meta property="og:title" content="ConverseKit" />
    <meta property="og:description" content="Drop-in AI chat for any website. Answers from your own docs. Captures leads. One script tag." />
    <meta property="og:image" content="https://conversekit-widget.pages.dev/brand/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
